version: 2.1

jobs:
  deployment:
    docker:
      - image: cimg/base:current  # Imagem Docker utilizada no job

    steps:
      - checkout  # Faz checkout do código-fonte do repositório
      
      # Tarefa para instalar o kubectl antes do login no cluster
      - run:
          name: "Instalar kubectl"
          command: |
            curl -LO https://storage.googleapis.com/kubernetes-release/release/`curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt`/bin/linux/amd64/kubectl
            chmod +x ./kubectl
            sudo mv ./kubectl /usr/local/bin/kubectl

      # Agora o login no cluster é feito após a instalação do kubectl
      - run:
          name: "Cluster login"
          command: "kubectl cluster-info"  # Executa o comando kubectl cluster-info para obter informações do cluster

workflows:
  deployment-workflow:
    jobs:
      - deployment  # Define que o job "deployment" será executado no workflow
